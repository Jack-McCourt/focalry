; PHP-FPM per-directory overrides for the web docroot.
; The app accepts message/gallery attachments up to 15 MB (Laravel validates
; `max:15360`), but the global FPM php.ini defaults (2M/8M) silently drop larger
; uploads before Laravel sees them. Raise both so attachments actually arrive.
upload_max_filesize = 20M
post_max_size = 120M
